[project]
name = "rwkv-rl-search-r1"
version = "0.1.0"
description = "RWKV RL on Search-R1 (NQ / HotpotQA) environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "numpy",
    "rwkv>=0.8.32",        # BlinkDL 官方推理包，含 RWKV-7 + world tokenizer
    "ninja",               # rwkv 在 CUDA 上编译 kernel 需要
    "datasets",
    "huggingface-hub",
    "pandas",
    "pyarrow",
    "requests",
    "tqdm",
]

[dependency-groups]
# Search-R1 检索服务（e5 + faiss，wiki-18 语料）
retriever = [
    "transformers",
    "fastapi",
    "uvicorn",
    "faiss-cpu; sys_platform == 'darwin'",
    "faiss-gpu-cu12; sys_platform == 'linux'",
    "pyserini>=2.4.0",
]
dev = [
    "ipykernel",
    "pytest",
]

[tool.uv]
default-groups = ["dev"]

# Linux 上用 CUDA 版 torch；macOS 用 PyPI 的默认版本（MPS）
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
